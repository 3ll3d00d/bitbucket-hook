plugins {
    id 'groovy'
}

repositories {
    mavenCentral()
    maven {
        // Atlassian public repo for Bitbucket Server API jars
        url 'https://packages.atlassian.com/maven/repository/public'
    }
}

dependencies {
    // Bitbucket Server API — provided at runtime by the Bitbucket OSGi container
    compileOnly 'com.atlassian.bitbucket.server:bitbucket-api:8.0.0'

    // Groovy
    implementation 'org.apache.groovy:groovy:4.0.15'

    // Test
    testImplementation 'org.spockframework:spock-core:2.3-groovy-4.0'
    testImplementation 'org.apache.groovy:groovy:4.0.15'
}

test {
    useJUnitPlatform()
}

// Convenience task to show the project structure
tasks.register('structure') {
    doLast {
        fileTree(projectDir).each { println it.path - projectDir.path }
    }
}
